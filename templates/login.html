<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VivahSetu Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body style="background:#f7f2ed"><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><form method="post" class="form-card" style="width:min(420px,100%)"><div class="brand" style="margin-bottom:25px"><span class="brand-mark">V</span><span>Vivah<span>Setu</span></span></div><div class="kicker">Secure CRM</div><h2 style="font-size:40px;margin:10px 0 22px">Admin login</h2><input name="password" type="password" placeholder="Admin password" required style="width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px"><button class="btn btn-primary full">Continue →</button>{% with messages=get_flashed_messages() %}{% if messages %}<p style="color:#9b3348;font-size:12px">{{messages[0]}}</p>{% endif %}{% endwith %}</form></main></body></html>
